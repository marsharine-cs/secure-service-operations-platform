name: Feature
description: Plan a user-facing capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem are we solving?
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a ... I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and tenant-isolation considerations
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisites or write "None."
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Interview learning goal
      description: What should the implementer be able to explain after completing this?
